<text x="1213" y="499" font-size="23" fill="#21364A" font-weight="400" text-anchor="start">已有证据：可追溯</text>
<text x="1213" y="543" font-size="23" fill="#21364A" font-weight="400" text-anchor="start">计算解释：有依据</text>
<text x="1213" y="587" font-size="23" fill="#21364A" font-weight="400" text-anchor="start">待验证项：明确标注</text>
